[package]
name = "pbblock"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Not its default "single-thread": the engine calls a blocker from many threads.
adblock = { version = "=0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# The resources example's: adblock-rust's reader of uBO's redirect resources (tools/lists).
assembler = ["adblock/resource-assembler"]

[[example]]
name = "resources"
required-features = ["assembler"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
base64 = "0.22"
