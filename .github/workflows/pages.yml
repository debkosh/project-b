# Publishes the project's site on GitHub Pages at site/CNAME's address: the homepage, which is
# the live demo (core/cmd/webdemo: the shell and the Go core running in the page, the engine
# a stand-in), with the Stable release's version written in, and the Linux Flatpak repository (docs/research/linux.md, 5) from
# the newest release that has one, as Linux releases are built only when asked. It runs on
# each Stable release, and by hand with a release's tag. The repository is under repo/, beside
# project-b.flatpakref and project-b.flatpakrepo.
name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The Stable release whose site to publish
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Built in one job and deployed in the next: deploy-pages looks the artifact up by the run's
  # artifacts, and in the same job right after the upload GitHub's list didn't have it yet, so
  # 0.3.12's three runs failed with "No artifacts named github-pages" (and a rerun of the job,
  # uploading again, then found two).
  build:
    # A Dev build's channels pre-release is no Stable release.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      # The page as it is on the branch the workflow runs from, main for a run by hand; the
      # version is the release's own.
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shell/package-lock.json
      - name: The homepage, the live demo, at its Stable version
        run: |
          (cd shell && npm ci && npm run build)
          VERSION=${TAG#v} core/cmd/webdemo/build.sh "$PWD/_site"
          cp -R site/. _site/
          touch _site/.nojekyll
      - name: The Linux Flatpak repository, from the newest release that has one
        run: |
          linux=""
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 50 --json tagName --jq '.[].tagName'); do
            if gh release view "$t" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx flatpak-repo.tar.gz; then
              linux=$t
              break
            fi
          done
          if [ -n "$linux" ]; then
            gh release download "$linux" --repo "$GITHUB_REPOSITORY" --dir dl \
              --pattern flatpak-repo.tar.gz --pattern project-b.flatpakref --pattern project-b.flatpakrepo
            tar -xzf dl/flatpak-repo.tar.gz -C _site
            cp dl/project-b.flatpakref dl/project-b.flatpakrepo _site/
            # The site's own address, site/CNAME, where an older release's files named Pages'.
            sed -i "s|https://sudiptadeb.github.io/project-b/|https://$(cat site/CNAME)/|g" _site/project-b.flatpakref _site/project-b.flatpakrepo
            echo "Linux repository from $linux"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
