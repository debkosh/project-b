# Publishes a Linux release's Flatpak repository on GitHub Pages (docs/research/linux.md, 5).
# Linux releases are built only when asked, so this runs by hand, with the release's tag: it
# takes the release's flatpak-repo.tar.gz, project-b.flatpakref and project-b.flatpakrepo, which
# tools/linux/flatpak-release.sh made and release attached, and serves them at
# https://sudiptadeb.github.io/project-b/ (the repository under repo/).
name: Linux Flatpak repository on Pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release whose Flatpak repository to publish
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Take the release's repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl \
            --pattern flatpak-repo.tar.gz --pattern project-b.flatpakref --pattern project-b.flatpakrepo
          mkdir site
          tar -xzf dl/flatpak-repo.tar.gz -C site
          cp dl/project-b.flatpakref dl/project-b.flatpakrepo site/
          touch site/.nojekyll
          cat > site/index.html <<HTML
          <!doctype html><meta charset="utf-8"><title>Project B for Linux</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>body{font:16px/1.5 system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem}code{background:#eee;padding:.1em .3em;border-radius:4px}</style>
          <h1>Project B for Linux</h1>
          <p>A preview, for arm64. It installs as a Flatpak.</p>
          <ol>
          <li>On Ubuntu, first: <code>sudo apt install flatpak</code>. Debian, Fedora, Arch and KDE's own distros have it or it's one command away.</li>
          <li><a href="project-b.flatpakref">Install Project B</a>: your software centre opens and asks.</li>
          <li>Or in a terminal: <code>flatpak install --from https://sudiptadeb.github.io/project-b/project-b.flatpakref</code></li>
          </ol>
          <p>Release $TAG. <a href="https://github.com/sudiptadeb/project-b">The project</a>.</p>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
